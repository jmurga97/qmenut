<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f5f5" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
    <!--
      Pre-paint theme bootstrap; the storage key matches ADMIN_THEME_STORAGE_KEY.
    -->
    <script>
      (() => {
        let theme = "light";
        try {
          theme = window.localStorage.getItem("qmenut-admin-theme") === "dark" ? "dark" : "light";
        } catch {
          // Keep the light default when localStorage is unavailable.
        }

        document.documentElement.classList.remove("light", "dark");
        document.documentElement.classList.add(theme);
        document.documentElement.style.colorScheme = theme;
        document
          .querySelector('meta[name="theme-color"]')
          ?.setAttribute("content", theme === "dark" ? "#000000" : "#f5f5f5");
      })();
    </script>
    <title>QMenut Admin</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
