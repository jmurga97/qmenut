<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f6f2" />
    <script>
      (() => {
        let theme = "light";
        try {
          theme = window.localStorage.getItem("qmenut-admin-theme") === "dark" ? "dark" : "light";
        } catch {
          // Keep the light default when localStorage is unavailable.
        }

        document.documentElement.classList.remove("light", "dark");
        document.documentElement.classList.add(theme);
        document.documentElement.style.colorScheme = theme;
        document
          .querySelector('meta[name="theme-color"]')
          ?.setAttribute("content", theme === "dark" ? "#171815" : "#f6f6f2");
      })();
    </script>
    <title>QMenut Admin</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
